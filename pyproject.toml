[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-arbitrage"
version = "0.1.0"
description = "AI-Driven Second-Order Arbitrage & Information-Latency Engine for Prediction Markets"
authors = [{name = "Quant Research Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "duckdb>=0.10.0",
    "dnspython>=2.6.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
